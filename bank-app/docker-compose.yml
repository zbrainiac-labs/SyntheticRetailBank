# Local run against Snowflake DEV.
# Credentials: the Snowflake CLI directory is mounted read-only and the app
# reads the PAT of SNOWFLAKE_CONNECTION from it at runtime. Nothing secret is
# baked into the image or written to the repo.
services:
  bank-app:
    platform: linux/arm64
    build:
      context: .
      platforms: [linux/arm64]
    image: bank-app:local
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SNOWFLAKE_HOME: /snowflake-cli
      SNOWFLAKE_CONNECTION: ${SNOWFLAKE_CONNECTION:-zs28104-svc_mdaeppen}
      # Optional overrides (default: values of the CLI connection)
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
    volumes:
      - ${HOME}/.snowflake:/snowflake-cli:ro
