name: CI / Deploy

# Verify every change, then deploy main: lint, bank-app typecheck + unit tests, arm64 image
# build + smoke test + Trivy, the SonarQube quality gate, and -- on main only, after all of them
# passed -- the DataOpsBackbone pipeline (DCM deploy to DEV, SQL tests, release).
# Same scripts as local-ci/run.sh, which runs this workflow locally with nektos/act.
# Modelled on crew-asset-management/.github/workflows/ci.yml (same pinned action SHAs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ShellCheck, ruff, actionlint (containerized, same as local-ci)
        run: bash local-ci/lint.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: bank-app typecheck + vitest with coverage
        run: bash local-ci/unit-tests.sh
      - name: Upload coverage + JUnit (sonar job reuses them)
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-reports
          path: bank-app/reports
          if-no-files-found: error

  image:
    # native arm64 runner: the image is linux/arm64 (Docker Desktop on Apple Silicon, ARM SPCS pool)
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: bank-app:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build arm64 image + smoke test
        run: bash local-ci/image.sh --tag="$IMAGE"
      - name: Trivy scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  # SonarQube on the DataOpsBackbone runners (self-hosted, on sonarnet with the sonar-init token
  # at /sonar), like MasterDataManagement. Community Build has no branch analysis, so one project
  # per stream: main = SyntheticRetailBank "(main)", pull requests = -local-pr "(pull requests)",
  # local runs and act = -local "(self-scan)". Coverage comes from the unit job.
  sonar:
    needs: unit
    # self-hosted runners: never run code from a fork pull request
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SONAR_PROJECT_KEY: >-
        ${{ github.event_name == 'pull_request' && 'SyntheticRetailBank-local-pr'
        || (github.ref == 'refs/heads/main' && !github.event.act) && 'SyntheticRetailBank'
        || 'SyntheticRetailBank-local' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # new-code detection needs history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ !env.ACT }}
        with:
          name: unit-reports
          path: bank-app/reports
      - name: SonarQube quality gate
        # act has no artifact server: the self-scan runs the unit tests itself there
        run: bash local-ci/sonar-self-scan.sh --strict ${{ !env.ACT && '--no-coverage' || '' }}

  # DataOpsBackbone pipeline (SQLFluff, DCM deploy to DEV, sqlunit/tests.sqltest, release), as in
  # MasterDataManagement: only on main and only when sonar and image passed. Never under act
  # (local deploys use deploy.sh).
  deploy:
    needs: [sonar, image]
    if: >-
      !cancelled() && needs.sonar.result == 'success' && needs.image.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.act != true
    permissions:
      id-token: write   # OIDC to Snowflake
      contents: write   # GitHub release
      actions: read
      checks: write
    uses: zbrainiac-labs/DataOpsBackbone/.github/workflows/dataops-pipeline.yml@v1
    with:
      SOURCE_DATABASE: AAA_DEV_SYNTHETIC_BANK
      SOURCE_SCHEMA: CRM_RAW_v001
      DCM_PROJECT_IDENTIFIER: AAA_DEV_SYNTHETIC_BANK.AAA_DCM.SYNTHETIC_RETAIL_BANK
      DCM_TARGET: DEV
      SNOWFLAKE_ACCOUNT: SFSEEUROPE-DEMO_MDAEPPEN
      # the sonar job above is this repo's Sonar analysis (with coverage); a second analysis on
      # the same key would overwrite it (no branches in Community Build). SQLFluff still runs.
      SONAR_SCAN: false
    secrets: inherit
