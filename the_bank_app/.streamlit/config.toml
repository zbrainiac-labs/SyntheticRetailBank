# Streamlit configuration - Apple-inspired design system (light + dark)
# Colours: Apple system palette (blue #007AFF / #0A84FF, greys #F5F5F7 / #1C1C1E).
# Typography: Inter (SF-like) with system sans-serif fallback. No custom CSS needed.

[theme]
base = "light"
primaryColor = "#007AFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
linkColor = "#0066CC"
borderColor = "#E5E5EA"
showWidgetBorder = false
baseRadius = "12px"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, -apple-system, BlinkMacSystemFont, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseFontSize = 15
chartCategoricalColors = ["#007AFF", "#34C759", "#FF9F0A", "#AF52DE", "#FF3B30", "#5AC8FA", "#FF2D55", "#5856D6", "#A2845E", "#8E8E93"]

[theme.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E5E5EA"

[theme.light]
primaryColor = "#007AFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
borderColor = "#E5E5EA"

[theme.light.sidebar]
backgroundColor = "#F5F5F7"

[theme.dark]
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
linkColor = "#409CFF"
borderColor = "#38383A"
# chartCategoricalColors is not supported per light/dark section (Streamlit 1.58); [theme] palette applies

[theme.dark.sidebar]
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#2C2C2E"

[server]
headless = true
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false
