# SonarQube project config -- used by local-ci/sonar-self-scan.sh (local DataOpsBackbone SonarQube).
# Same naming as crew-asset-management / BankLens: <repo>-local / "<repo> (self-scan)".
sonar.projectKey=synthetic-retail-bank-local
sonar.projectName=SyntheticRetailBank (self-scan)
sonar.sourceEncoding=UTF-8

sonar.sources=bank-app/app,bank-app/components,bank-app/lib,generators,the_bank_app,sources,local-ci,deploy.sh,upload-data.sh,data_generator.sh
sonar.tests=bank-app/__tests__,bank-app/e2e,sqlunit
sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=bank-app/reports/coverage/lcov.info
sonar.junit.reportPaths=bank-app/reports

# Generated, vendored or per-run content
sonar.exclusions=**/node_modules/**,**/.next/**,**/test-results/**,**/playwright-report/**,bank-app/reports/**,\
  **/__pycache__/**,venv/**,venv.*/**,the_bank_app/venv/**,generated_data/**,notebooks/**,\
  bank-app/components/ui/**,bank-app/next-env.d.ts,**/*.md,**/*.json,**/*.yml,**/*.yaml,**/*.csv
# Only the bank-app TypeScript libraries are unit tested; UI pages, API routes and the Snowflake I/O
# layer (lib/db.ts, the useLoader hook) are covered by Playwright against the running container, and
# generators/the_bank_app/SQL by the DCM sqlunit gate (Snowflake) -- neither produces lcov.
sonar.coverage.exclusions=bank-app/app/**,bank-app/components/**,bank-app/lib/db.ts,bank-app/lib/loaders/client.ts,bank-app/lib/clipboard.ts,\
  generators/**,the_bank_app/**,sources/**,local-ci/**,**/*.sh,**/*.sql
sonar.cpd.exclusions=sources/**,**/*.sql

sonar.text.inclusions=**/*.sql
sonar.sql.dialect=snowflake

# Reviewed exceptions (each with its justification):
#  e1  python:S2245 (pseudorandom generator) in generators/: the synthetic data is generated from
#      seeded random streams on purpose -- reproducible output (byte-identical LCR) is a requirement,
#      nothing there is security-sensitive. A CSPRNG would break reproducibility.
#  e2  maturity-level text rule on 065_LOAI_ingestion.sql: the regex ^.{4}(RAW|..)_ matches the
#      column RAW_EXTRACTED_DATA at 4-space indent; it is a column, not an object name.
#  e3  typescript:S1607 (skipped test) in bank-app/e2e: the read-only suite is skipped with a reason when
#      RO_URL (second container with SNOWFLAKE_ROLE=DTI_READ_ONLY) is not set -- an intentional, explained skip.
#  e4  typescript:S6479 (array index as key) in the listed files: append-only or positional lists that
#      never reorder (agent step list / returned tables, markdown list items, Recharts <Cell> per bar).
#      Lists that sort or change order (DataTable rows, chat turns) use stable ids.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e4.resourceKey=bank-app/app/ai/ask/page.tsx
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e5.resourceKey=bank-app/components/ai/markdown.tsx
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e6.resourceKey=bank-app/components/lending/charts.tsx
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=generators/**
sonar.issue.ignore.multicriteria.e2.ruleKey=txt:Enforce__maturity_level__Code_at_Positions_5_7
sonar.issue.ignore.multicriteria.e2.resourceKey=sources/definitions/065_LOAI_ingestion.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e3.resourceKey=bank-app/e2e/**
